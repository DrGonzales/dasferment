name: Buch als PDF

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: buch
  cancel-in-progress: true

jobs:
  pdf:
    name: PDF bauen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten
        run: npm ci

      - name: PDF bauen
        run: npm run make:pdf

      - name: Artefakt
        uses: actions/upload-artifact@v5
        with:
          name: das-ferment
          path: dist-book/das-ferment.pdf
          retention-days: 30
